services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sovereign_workbench
      POSTGRES_USER: postgres
      # Local development only. Override for any deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sovereign_workbench"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
