pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    # Do not log cookies, query text, authorization codes, or request bodies.
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $server_name zone=demo:1m rate=20r/s;
    # Preserve NWIS paths; strip exactly once for approved shared endpoints.
    map $uri $upstream_path {
        default "";
        ~^/api/(wells|events|query|assessments|advisories|terms|reports)(/|$) $uri;
        /api/audit /api/audit;
        ~^/api/(auth/(capabilities|login|logout|me|sessions)(/|$).*)$ /$1;
        /api/health /health;
        /api/ready /ready;
        /api/audit/verify /audit/verify;
    }
    upstream nwis_backend { server backend:8000; }
    server {
        listen 8080;
        client_max_body_size 1m;
        limit_req zone=demo burst=60 nodelay;
        limit_req_status 429;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Vercel-CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        location / {
            if ($upstream_path = "") { return 404 '{"detail":"Route unavailable"}'; }
            proxy_pass http://nwis_backend$upstream_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Origin $http_origin;
            proxy_set_header Referer $http_referer;
            # Ignore untrusted forwarded identity/IP headers from direct gateway callers.
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_hide_header Cache-Control;
            proxy_hide_header CDN-Cache-Control;
            proxy_hide_header Vercel-CDN-Cache-Control;
            proxy_connect_timeout 5s;
            proxy_read_timeout 180s;
            proxy_send_timeout 30s;
            proxy_redirect off;
        }
    }
}
