# One-click (re)provisioning of the hosted demo database on Neon: migrations, synthetic NWIS seed and the public
# evaluator account. Idempotent. The Qdrant evidence index is rebuilt automatically by the Vercel function (api/index.py).
name: seed-hosted-demo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.NWIS_DEMO_DATABASE_URL }}
      PYTHONPATH: .:backend
      MODEL_NAME: qwen3.5:9b
      WORKBENCH_HOSTED_DEMO: "true"
      WORKBENCH_DEPLOYMENT_MODE: public
      WORKBENCH_DATA_ROOT: ${{ github.workspace }}/.seed-data
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-linux.lock
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libgomp1
      - run: python -m pip install -r backend/requirements-linux.lock
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m scripts.seed_nwis
      - run: python backend/scripts/seed_demo_account.py
      - name: Generated report PDFs must match the ones the Vercel function serves
        run: diff -r .seed-data/nwis/reports data/nwis-hosted/nwis/reports
