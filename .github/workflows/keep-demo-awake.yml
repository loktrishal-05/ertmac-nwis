# Daily uptime check for the hosted demo; a failed run makes GitHub email the repository owner.
# Read-only on purpose: no login, no search, so it never writes sessions/audit rows to the 1 GB Neon database.
name: keep-demo-awake
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://sovereign-ai-workbench-nine.vercel.app
    steps:
      - name: Site and backend health (no database writes)
        run: |
          set -eu
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 30 -o /dev/null "$SITE/"
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 30 "$SITE/api/health"
          echo "site and backend OK"
